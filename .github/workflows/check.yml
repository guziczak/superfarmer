name: Check game
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - name: Verify generated files are committed
        run: git diff --exit-code -- index.html dist/superfarmer.artifact.html sw.js manifest.webmanifest icon.svg
